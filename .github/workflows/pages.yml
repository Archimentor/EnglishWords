name: Verify and deploy Pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch and verify pinned phrasal sources
        run: npm run content:fetch:phrasals
      - run: npx playwright install --with-deps chromium
      - name: Run project checks
        run: npm run check 2>&1 | tee /tmp/project-check.log
      - name: Run browser checks
        run: npm run test:browser 2>&1 | tee /tmp/browser-check.log
      - name: Persist failure diagnostics
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          {
            echo "# Last CI failure"
            echo
            echo "Commit: $GITHUB_SHA"
            echo
            echo '## Project checks'
            tail -n 240 /tmp/project-check.log 2>/dev/null || true
            echo
            echo '## Browser checks'
            tail -n 240 /tmp/browser-check.log 2>/dev/null || true
          } > .github/ci-last-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ci-last-failure.log
          git commit -m "ci: record latest verification failure" || true
          git push || true
      - name: Commit refreshed offline entry
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .github/ci-last-failure.log ]; then
            git rm .github/ci-last-failure.log
          fi
          git add index.html public/data/DEVELOPMENT/reader-story-coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh offline index and reader coverage"
            git push
          fi
      - run: npm run validate:release
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
