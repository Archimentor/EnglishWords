name: Add full phrasal component dictionary lookup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-phrasal-dictionary-lookup.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Add full dictionary prop and remove migration workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/App.tsx')
          text = path.read_text(encoding='utf-8')
          old = """        lookupWords={lookupLevels.flatMap(\n          (lookupLevel) => catalog.wordlists[lookupLevel],\n        )}\n        targetWordCount={WORD_TARGETS[level]}"""
          new = """        lookupWords={lookupLevels.flatMap(\n          (lookupLevel) => catalog.wordlists[lookupLevel],\n        )}\n        phrasalLookupWords={LEVELS.flatMap(\n          (lookupLevel) => catalog.wordlists[lookupLevel],\n        )}\n        targetWordCount={WORD_TARGETS[level]}"""
          if text.count(old) != 1:
              raise SystemExit(f'expected exact StoryView prop block once, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/add-phrasal-dictionary-lookup.yml
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx
          git commit -m "feat: resolve phrasal components from full word catalog"
          git push
