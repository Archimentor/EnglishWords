name: Migrate story UI integration assertion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/story-ui-test-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Replace obsolete story coverage assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/App.integration.test.tsx')
          text = path.read_text(encoding='utf-8')
          old = "  expect(within(story).getByText('릴리스 목표 대비 8 / 500 (1.6%)')).toBeInTheDocument()"
          new = "\n".join([
              "  expect(within(story).queryByText('실제 소설 본문 커버리지')).not.toBeInTheDocument()",
              "  expect(within(story).queryByText('전체 학습 단어')).not.toBeInTheDocument()",
              "  expect(within(story).queryByText('전체 학습 구동사')).not.toBeInTheDocument()",
          ])
          if old not in text:
              raise SystemExit('obsolete assertion not found exactly once')
          if text.count(old) != 1:
              raise SystemExit('obsolete assertion occurrence count is not one')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.integration.test.tsx
          git diff --cached --exit-code && exit 1 || true
          git commit -m "test: remove obsolete story coverage assertion"
          git push
